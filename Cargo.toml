[package]
name = "uzda"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "net", "signal", "process", "time", "sync", "fs", "io-util"] }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "query"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = { version = "2.2", default-features = false, features = ["deserialize"] }
tokio-stream = "0.1"
anyhow = "1"
async-stream = "0.3"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
